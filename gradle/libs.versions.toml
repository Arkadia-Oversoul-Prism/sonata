[versions]
agp              = "8.2.2"
kotlin           = "1.9.22"
coreKtx          = "1.12.0"
appcompat        = "1.6.1"
material         = "1.11.0"
constraintlayout = "2.1.4"
preference       = "1.2.1"
coroutines       = "1.7.3"
okhttp           = "4.12.0"
media            = "1.7.0"
junit            = "4.13.2"
robolectric      = "4.11.1"
androidxTestRunner = "1.5.2"
androidxTestRules = "1.5.0"
androidxTestExt  = "1.1.5"
espresso         = "3.5.1"
okhttpMock       = "4.12.0"
coroutinesTest   = "1.7.3"
room             = "2.6.1"
ksp              = "1.9.22-1.0.17"

[libraries]
androidx-core-ktx          = { group = "androidx.core",              name = "core-ktx",               version.ref = "coreKtx" }
androidx-appcompat         = { group = "androidx.appcompat",         name = "appcompat",               version.ref = "appcompat" }
material                   = { group = "com.google.android.material", name = "material",                version.ref = "material" }
androidx-constraintlayout  = { group = "androidx.constraintlayout",  name = "constraintlayout",        version.ref = "constraintlayout" }
androidx-preference-ktx    = { group = "androidx.preference",        name = "preference-ktx",          version.ref = "preference" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp                     = { group = "com.squareup.okhttp3",       name = "okhttp",                  version.ref = "okhttp" }
androidx-media             = { group = "androidx.media",             name = "media",                   version.ref = "media" }
junit                      = { group = "junit",                      name = "junit",                   version.ref = "junit" }
robolectric                = { group = "org.robolectric",           name = "robolectric",             version.ref = "robolectric" }
kotlinx-coroutines-test    = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-test",  version.ref = "coroutinesTest" }
androidx-test-runner       = { group = "androidx.test",              name = "runner",                   version.ref = "androidxTestRunner" }
androidx-test-rules        = { group = "androidx.test",              name = "rules",                    version.ref = "androidxTestRules" }
androidx-test-ext-junit    = { group = "androidx.test.ext",          name = "junit",                    version.ref = "androidxTestExt" }
espresso-core              = { group = "androidx.test.espresso",     name = "espresso-core",            version.ref = "espresso" }
okhttp-mockwebserver       = { group = "com.squareup.okhttp3",       name = "mockwebserver",            version.ref = "okhttpMock" }
androidx-room-runtime      = { group = "androidx.room",              name = "room-runtime",             version.ref = "room" }
androidx-room-ktx          = { group = "androidx.room",              name = "room-ktx",                 version.ref = "room" }
androidx-room-compiler     = { group = "androidx.room",              name = "room-compiler",            version.ref = "room" }
androidx-room-testing      = { group = "androidx.room",              name = "room-testing",             version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
