name: Sonata CI

# Runs on every push and pull request. The evidence this produces is what the
# production-review package cites: the workflow run is bound to a commit SHA, and
# the SHA is what the PR body names. A green badge without a SHA is not evidence.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-verification:
    name: JVM verification (app core + narration core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Kotlin compiler
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -q /tmp/kotlin.zip -d "$HOME/.local"
          echo "$HOME/.local/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned test dependencies
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.sonata-lib"
          cd "$HOME/.sonata-lib"
          # repo.maven.apache.org is the canonical host; repo1.maven.org is a
          # mirror that rate-limits shared runner IPs. A rate-limited mirror
          # returns a short error page with HTTP 200, which curl -sSLO writes to
          # disk as if it were a jar.
          base=https://repo.maven.apache.org/maven2
          google=https://dl.google.com/dl/android/maven2

          # fetch <url> <filename> <minimum-bytes>
          #
          # A jar that is not a zip is not a jar. Without this check the harness
          # compiled against 96-byte error pages and reported "COMPILE FAILED",
          # which reads as a code defect and is not one. Failing here names the
          # real cause.
          fetch() {
            local url="$1" out="$2" min="$3" attempt
            for attempt in 1 2 3 4 5; do
              curl -sSL --retry 3 --retry-delay 2 -o "$out" "$url" || true
              if [ -s "$out" ] && [ "$(stat -c%s "$out")" -ge "$min" ] \
                 && [ "$(head -c2 "$out")" = "PK" ]; then
                return 0
              fi
              echo "  retry $attempt: $out is not a valid jar ($(stat -c%s "$out" 2>/dev/null || echo 0) bytes)"
              sleep $((attempt * 3))
            done
            echo "::error::Could not fetch a valid jar: $url"
            echo "  last response: $(head -c 200 "$out" 2>/dev/null)"
            return 1
          }

          fetch $base/junit/junit/4.13.2/junit-4.13.2.jar junit-4.13.2.jar 200000
          fetch $base/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar hamcrest-core-1.3.jar 30000
          fetch $base/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.7.3/kotlinx-coroutines-core-jvm-1.7.3.jar kotlinx-coroutines-core-jvm-1.7.3.jar 200000
          fetch $base/org/jetbrains/kotlinx/kotlinx-coroutines-test-jvm/1.7.3/kotlinx-coroutines-test-jvm-1.7.3.jar kotlinx-coroutines-test-jvm-1.7.3.jar 100000
          fetch $base/com/squareup/okhttp3/okhttp/4.12.0/okhttp-4.12.0.jar okhttp-4.12.0.jar 500000
          fetch $base/com/squareup/okio/okio-jvm/3.6.0/okio-jvm-3.6.0.jar okio-jvm-3.6.0.jar 200000
          fetch $base/org/json/json/20240303/json-20240303.jar json-20240303.jar 50000
          fetch $google/androidx/room/room-common/2.6.1/room-common-2.6.1.jar room-common-2.6.1.jar 20000
          # The harness expects annotation-1.7.1.jar (see CP_JARS in
          # ci/run-ci.sh). The artifact is published as annotation-jvm-1.7.1.jar,
          # so it is saved under the name the harness looks for. The preflight in
          # run-ci.sh caught this mismatch as MISSING JAR rather than letting
          # kotlinc fail on unresolved references.
          fetch $google/androidx/annotation/annotation-jvm/1.7.1/annotation-jvm-1.7.1.jar annotation-1.7.1.jar 20000
          ls -la

      - name: JVM verification (app core + narration core)
        run: |
          set -euo pipefail
          export LIB="$HOME/.sonata-lib"
          export STD="$(dirname "$(command -v kotlinc)")/../lib"
          # One tracked entrypoint for both jobs. It writes ci-evidence.log with
          # the commit and tree SHA it actually ran against.
          ./ci/run-ci.sh | tee ci-run.log
          echo "---- ci-evidence.log ----"
          cat ci-evidence.log

      - name: Record the commit under test
        if: always()
        run: |
          echo "commit_sha=$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "short_sha=$(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonata-ci-evidence-${{ github.sha }}
          path: |
            ci-evidence.log
            ci-run.log
          retention-days: 90

  # The Android build lives in .github/workflows/build-apk.yml, which runs the
  # unit suite, lint, assembleRelease, assembleDebug and the API-34 instrumented
  # suite. It is a separate workflow because it needs the Android SDK and an
  # emulator, and because a failure there must be a distinct signal from the
  # JVM verification above.
  #
  # A duplicate android-build job used to live here. It called
  # android-actions/setup-android@v3, which fails on current runners with
  # "Failed to find package 'tools'" — the package was removed from the SDK
  # repository. It never built anything; it only produced a red X. Removed
  # rather than left as decoration.
